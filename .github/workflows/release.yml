name: release

# 一条流水线同时出 fpk（fnOS）和 exe（Windows），都传同一个 Release。
#
# 内核 hermes-src 不在 git 里（85MB / 3231 文件，被 .gitignore 排除）。
# 它作为资产挂在 tag=kernel 的 prerelease 上，这里下载解压。
# 为什么这么做：内核是上游代码快照，塞进 git 会让每次 clone 多搬 29MB，
# 而且它跟本仓的改动节奏不同步。用 Release 资产 = 有版本、有 hash、可按需换。

# 触发（2026-11-27 补 push 触发）：
#   1) push tag             → 正式发版（版本号就是 tag，不加 v 前缀）
#   2) push main            → 自动构建；版本号在 Release 里还不存在就一并发布，
#                             已存在就只构建出 artifact 供下载，绝不覆盖线上资产
#   3) workflow_dispatch    → 手动，dry=true 时只构建不发布
# 这样"提交 GitHub 就自动打包"才成立：以前只认 tag，普通提交压根不触发。
on:
  push:
    branches:
      - main
    # 纯文档/说明改动不占 runner（打一次包：fpk ~10min + exe ~20min）
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      dry:
        description: '只跑校验，不发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 先跑门禁：版本一致性 + 凭据闸。任何一项红就停，不浪费 runner 时间
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号并校验 tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('win/version.json'))['version'])")
          E=$(python3 -c "import json;print(json.load(open('electron/package.json'))['version'])")
          echo "win/version.json      = $V"
          echo "electron/package.json = $E"
          [ "$V" = "$E" ] || { echo "::error::两个版本号不一致：$V vs $E"; exit 1; }
          # 版本号就是 tag，不加 v 前缀、不加 -win.N 后缀（2026-11-26 定）。
          # 手工补 tag 时也兼容老写法 v1.20.8，剥掉前缀再比对。
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PLAIN="${TAG#v}"
            [ "$PLAIN" = "$V" ] || { echo "::error::tag=$TAG 与版本 $V 不一致"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            TAG="$V"
            # 普通提交：Release 里已经有这个版本号（且带资产）就只构建、不覆盖。
            # 判据是资产是否存在，不是 Release 是否存在 —— 空壳 release 补传是合理的。
            if gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null | grep -qv '^0$'; then
              echo "Release $TAG 已有资产 → 本次只构建，不覆盖已发布产物"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG 无资产或不存在 → 构建后发布"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 凭据闸
        run: |
          set -euo pipefail
          for bad in .env auth.json credentials.json; do
            [ -e "data-skeleton/$bad" ] && { echo "::error::data-skeleton 里有 $bad"; exit 1; }
          done
          BAD=$( { grep -rEn '^(QQ_CLIENT_SECRET|NAS_SSH_PASS|SUDO_PASSWORD|GITHUB_PAT|GITHUB_TOKEN[A-Z_]*|GITEA_TOKEN|ZOTERO_API_KEY|DISCORD_BOT_TOKEN|TELEGRAM_SESSION_STRINGS)=[^[]' data-skeleton/ 2>/dev/null || true; } | wc -l)
          [ "$BAD" -eq 0 ] || { echo "::error::骨架里有 $BAD 行明文凭据"; exit 1; }
          echo "凭据闸通过"

      # 出厂数据按"值"反搜：姓名/学校/本机路径/密钥/Bearer/手机号/身份证/openid
      # 以及 config.yaml 的 providers/mcp_servers/platforms 必须为空
      - name: 出厂数据敏感审计
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 release-tools/audit_data_skeleton.py

  # fpk：在 Linux 上打 fnOS 包
  fpk:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 取内核
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download kernel -p 'hermes-src.tgz' -D /tmp/k
          mkdir -p app
          tar xzf /tmp/k/hermes-src.tgz -C app
          # tgz 内层可能是 hermes-src/ 也可能是散开的，两种都认
          if [ ! -d app/hermes-src ]; then
            cand=$(find app -maxdepth 2 -name pyproject.toml -printf '%h\n' | head -1)
            [ -n "$cand" ] && mv "$cand" app/hermes-src
          fi
          [ -d app/hermes-src ] || { echo "::error::内核解压后找不到 app/hermes-src"; ls -R app | head -30; exit 1; }
          echo "内核文件数: $(find app/hermes-src -type f | wc -l)"

      - name: 构建 fpk
        run: |
          set -euo pipefail
          bash release-tools/build-fpk.sh --tag "${{ needs.gate.outputs.tag }}"
          ls -l dist/*.fpk

      - uses: actions/upload-artifact@v4
        with:
          name: fpk
          path: dist/*.fpk
          if-no-files-found: error

  # exe：在 Windows 上跑 electron-builder 出 NSIS 安装包
  exe:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 uv（build-exe 用它拉 Windows 版 Python 运行时）
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://astral.sh/uv/install.ps1 -OutFile $env:TEMP\uv.ps1
          & $env:TEMP\uv.ps1
          $uvdir = "$env:USERPROFILE\.local\bin"
          Write-Host "uv dir: $uvdir"
          Get-ChildItem $uvdir -ErrorAction SilentlyContinue | Select-Object Name
          # Git Bash 的 $HOME 与 Windows 的 USERPROFILE 可能不同，两个都写进 PATH
          Add-Content -Path $env:GITHUB_PATH -Value $uvdir
          & "$uvdir\uv.exe" --version

      - name: 取内核
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download kernel -p 'hermes-src.tgz' -D /tmp/k
          mkdir -p app
          # tgz 内层固定是 hermes-src/，解到 app 下即 app/hermes-src。
          # 不用 find -printf：Windows runner 的 find 是 Git-for-Windows 版没有 -printf，
          # 静默失败会让后面整形成空操作，job 停在找不到 app/hermes-src（1.20.8 首跑就是这么红的）。
          tar xzf /tmp/k/hermes-src.tgz -C app
          if [ ! -f app/hermes-src/pyproject.toml ]; then
            for d in app/*/; do
              if [ -f "${d}pyproject.toml" ]; then mv "$d" app/hermes-src.tmp && mv app/hermes-src.tmp app/hermes-src && break; fi
            done
          fi
          [ -f app/hermes-src/pyproject.toml ] || { echo "::error::内核解压后找不到 app/hermes-src/pyproject.toml"; ls -la app | head -30; exit 1; }
          echo "内核文件数: $(ls -R app/hermes-src | wc -l)"

      - name: 构建 NSIS 安装包
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          bash release-tools/build-exe.sh --tag "${{ needs.gate.outputs.tag }}"
          ls -l electron/dist/*.exe 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            electron/dist/*.exe
            electron/dist/*.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  # 发布：两个产物 + latest.yml + SHA256SUMS 传同一个 Release
  publish:
    needs: [gate, fpk, exe]
    if: ${{ needs.gate.outputs.publish == 'true' && !inputs.dry }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回产物
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: 摊平目录并生成校验
        run: |
          set -euo pipefail
          find release -type f -exec mv {} release/ \; 2>/dev/null || true
          find release -mindepth 1 -type d -empty -delete 2>/dev/null || true
          ls -lR release
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$GITHUB_WORKSPACE/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，补传资产"
          else
            gh release create "$TAG" --title "CHATES $TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" release/* --clobber
          echo "已发布 https://github.com/${{ github.repository }}/releases/tag/$TAG"
