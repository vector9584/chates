name: release

# 一条 tag 触发，两个 runner 并行，产物合并到一个 Release。
#
# 为什么分两个 job：fpk 的 fnpack 只出 Linux 目标，NSIS 只出 Windows 目标，
# 没有哪个 runner 能同时干这两件事。所以按产物分机器，最后用一个 job 汇总上传。
#
# 为什么资源不预存：exe 需要 516MB 资源树（内核 88M / python 204M / node 83M），
# 进 git 会把仓库撑爆。所以每个 runner 现场重建——源码来自 checkout，
# python 用 uv 下，node 从 nodejs.org 下，data 用脱敏骨架。
# 这样每次发版都是「从源码可复现」，也不会有陈旧二进制混进新版本。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.20.0-win.9）'
        required: true

permissions:
  contents: write

env:
  NODE_VER: v20.18.1

jobs:
  # ------------------------------------------------------------ fpk
  fpk:
    name: build fpk (fnOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 fnpack 可用
        run: |
          test -x release-tools/vendor/fnpack || { echo "::error::缺 release-tools/vendor/fnpack"; exit 1; }
          release-tools/vendor/fnpack --help | head -2
          # 静态链接检查：CI runner 上没有飞牛组件，必须是无依赖单文件
          ldd release-tools/vendor/fnpack 2>&1 | grep -q "not a dynamic" \
            || { echo "::error::fnpack 不是静态链接，runner 上可能跑不起来"; exit 1; }

      - name: 准备内核源码
        run: |
          . scripts/prepare-kernel.sh

      - name: 构建 fpk
        run: bash release-tools/build-fpk.sh --tag "${GITHUB_REF_NAME:-${{ inputs.tag }}}"

      - name: 记产物信息
        id: info
        run: |
          ls -la dist/
          FPK=$(ls dist/*.fpk | head -1)
          echo "sha256=$(sha256sum "$FPK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: fpk
          path: dist/*.fpk
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------ exe
  exe:
    name: build exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uv
        run: pip install uv

      - name: 准备内核源码
        shell: bash
        run: |
          . scripts/prepare-kernel.sh

      - name: 构建 exe
        shell: bash
        env:
          NODE_VER: ${{ env.NODE_VER }}
        run: bash release-tools/build-exe.sh --tag "${GITHUB_REF_NAME:-${{ inputs.tag }}}"

      - name: 记产物信息
        id: info
        shell: bash
        run: |
          ls -la electron/dist/ || true
          EXE=$(find electron/dist -maxdepth 1 -name '*.exe' | head -1)
          echo "exe=$(basename "$EXE")" >> $GITHUB_OUTPUT
          echo "size=$(stat -c %s "$EXE")" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: electron/dist/*.exe
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------ 发布
  publish:
    name: create release
    needs: [fpk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 归拢产物
        run: |
          mkdir -p release
          find artifacts -name '*.fpk' -exec cp {} release/ \;
          find artifacts -name '*.exe' -exec cp {} release/ \;
          ls -la release/
          # 两个产物必须都在，少一个是流水线断了不是「可选」
          ls release/*.fpk >/dev/null || { echo "::error::缺 fpk"; exit 1; }
          ls release/*.exe >/dev/null || { echo "::error::缺 exe"; exit 1; }

      - name: 生成校验文件
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: CHATÈS ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          files: |
            release/*.fpk
            release/*.exe
            release/SHA256SUMS.txt
          body: |
            ## 安装

            **Windows**：下载 `CHATES-Setup-*.exe`，双击安装即可，无需单独装 Node/Python。

            **fnOS**：下载 `hermes-agent_*.fpk`，在应用中心「手动安装」上传。

            两个包都是 CI 从同一份源码现场构建。

            ## 校验

            ```
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
